<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrative Council 2.0 | Central Registry Login</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 35px rgba(245, 158, 11, 0.15);
      position: relative;
      z-index: 10;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .auth-header h2 {
      font-size: 26px;
      color: var(--color-white);
      margin-bottom: 8px;
    }

    .auth-header p {
      color: var(--color-slate-400);
      font-size: 13.5px;
    }

    .demo-credentials-box {
      margin-top: 24px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(245, 158, 11, 0.3);
      border-radius: var(--radius-md);
    }

    .demo-credentials-box h5 {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fbbf24;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-chips {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .demo-chip-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--color-slate-200);
      font-size: 12.5px;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: left;
    }

    .demo-chip-btn:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(245, 158, 11, 0.4);
      color: var(--color-white);
      transform: translateX(3px);
    }

    .back-gateway-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--color-slate-400);
      transition: color var(--transition-fast);
    }

    .back-gateway-link:hover {
      color: #fbbf24;
    }
  </style>
</head>
<body class="admin-theme">
  <div class="auth-page-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-badge">
          <span>🏛️</span> University Council & Administration 2.0
        </div>
        <h2>Administrative Sign In</h2>
        <p>Master executive access for student admissions, faculty registry, course curriculum, timetable scheduler, and MySQL database dumps.</p>
      </div>

      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label class="form-label" for="adminIdentifier">Administrator Username or Email</label>
          <input 
            type="text" 
            id="adminIdentifier" 
            class="form-control" 
            placeholder="e.g. admin or admin@csc114.edu" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="password">Master Passcode</label>
            <span style="font-size: 11.5px; color: #fbbf24; cursor: pointer;" onclick="showDefaultPassHint()">Default: 123</span>
          </div>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Enter passcode (default: 123)" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-admin-primary" style="width: 100%; margin-top: 10px; height: 46px;">
          Authorize & Enter Executive Console ➔
        </button>
      </form>

      <!-- 1-Click Demo Accounts -->
      <div class="demo-credentials-box">
        <h5>
          <span>⚡ 1-Click Quick Demo Login</span>
          <span style="font-weight: normal; opacity: 0.8;">Passcode: 123</span>
        </h5>
        <div class="demo-chips">
          <button type="button" class="demo-chip-btn" onclick="quickFillAdmin('admin')">
            <div>
              <strong>Prof. Dr. M. Rahman</strong>
              <div style="font-size: 11px; color: var(--color-slate-400);">Dean & Chief Academic Administrator</div>
            </div>
            <span style="color: #fbbf24; font-weight: bold;">Fill ➔</span>
          </button>

          <button type="button" class="demo-chip-btn" onclick="quickFillAdmin('registrar')">
            <div>
              <strong>Engr. Farhana Chowdhury</strong>
              <div style="font-size: 11px; color: var(--color-slate-400);">Assistant Registrar (Academics)</div>
            </div>
            <span style="color: #fbbf24; font-weight: bold;">Fill ➔</span>
          </button>
        </div>
      </div>

      <a href="../index.html" class="back-gateway-link">
        ← Return to Master University Gateway
      </a>
    </div>
  </div>

  <div id="v2-toast-container" class="toast-container"></div>

  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Redirect if already authenticated as admin
    document.addEventListener("DOMContentLoaded", () => {
      const existing = AuthV2.getAdmin();
      if (existing) {
        window.location.href = "index.html";
      }
    });

    function quickFillAdmin(username) {
      document.getElementById("adminIdentifier").value = username;
      document.getElementById("password").value = "123";
      AuthV2.showToast(`Selected administrator credentials for ${username}. Click authorize!`, "info");
    }

    function showDefaultPassHint() {
      AuthV2.showToast("All administrator demo accounts use passcode: 123", "info");
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const id = document.getElementById("adminIdentifier").value;
      const pass = document.getElementById("password").value;

      const res = AuthV2.loginAdmin(id, pass);
      if (res.success) {
        AuthV2.showToast(`Authorized: Welcome ${res.user.name}! Entering Master Control Room...`, "success");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 600);
      } else {
        AuthV2.showToast(res.message, "error");
      }
    }
  </script>
</body>
</html>
