<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Academic Portal 2.0 | Secure Student Login</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/student.css">
  <style>
    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 30px rgba(79, 70, 229, 0.15);
      position: relative;
      z-index: 10;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(79, 70, 229, 0.15);
      border: 1px solid rgba(79, 70, 229, 0.35);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .auth-header h2 {
      font-size: 26px;
      color: var(--color-white);
      margin-bottom: 8px;
    }

    .auth-header p {
      color: var(--color-slate-400);
      font-size: 13.5px;
    }

    .demo-credentials-box {
      margin-top: 24px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(99, 102, 241, 0.3);
      border-radius: var(--radius-md);
    }

    .demo-credentials-box h5 {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #a5b4fc;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-chips {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .demo-chip-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--color-slate-200);
      font-size: 12.5px;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: left;
    }

    .demo-chip-btn:hover {
      background: rgba(79, 70, 229, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
      color: var(--color-white);
      transform: translateX(3px);
    }

    .back-gateway-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--color-slate-400);
      transition: color var(--transition-fast);
    }

    .back-gateway-link:hover {
      color: #a5b4fc;
    }
  </style>
</head>
<body class="student-theme">
  <div class="auth-page-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-badge">
          <span>🎓</span> Student Academic Portal 2.0
        </div>
        <h2>Student Sign In</h2>
        <p>Enter your Student ID or institutional email to access your personal dashboard, courses, and exam transcript.</p>
      </div>

      <form id="studentLoginForm" onsubmit="handleStudentLogin(event)">
        <div class="form-group">
          <label class="form-label" for="studentId">Student ID or Institutional Email</label>
          <input 
            type="text" 
            id="studentId" 
            class="form-control" 
            placeholder="e.g. CSC114-001 or rahim@example.com" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="password">Password</label>
            <span style="font-size: 11.5px; color: #818cf8; cursor: pointer;" onclick="showDefaultPassHint()">Default: 123</span>
          </div>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Enter password (default: 123)" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-student-primary" style="width: 100%; margin-top: 10px; height: 46px;">
          Authenticate & Enter Student Portal ➔
        </button>
      </form>

      <!-- 1-Click Demo Accounts -->
      <div class="demo-credentials-box">
        <h5>
          <span>⚡ 1-Click Quick Demo Login</span>
          <span style="font-weight: normal; opacity: 0.8;">Password: 123</span>
        </h5>
        <div class="demo-chips">
          <button type="button" class="demo-chip-btn" onclick="quickFillStudent('CSC114-001')">
            <div>
              <strong>Rahim Ahmed</strong> (Section A Rep)
              <div style="font-size: 11px; color: var(--color-slate-400);">ID: CSC114-001 | CGPA: 3.82</div>
            </div>
            <span style="color: #38bdf8; font-weight: bold;">Fill ➔</span>
          </button>

          <button type="button" class="demo-chip-btn" onclick="quickFillStudent('CSC114-002')">
            <div>
              <strong>Nusrat Jahan</strong> (Undergrad Scholar)
              <div style="font-size: 11px; color: var(--color-slate-400);">ID: CSC114-002 | CGPA: 3.90</div>
            </div>
            <span style="color: #38bdf8; font-weight: bold;">Fill ➔</span>
          </button>
        </div>
      </div>

      <a href="../index.html" class="back-gateway-link">
        ← Return to Master University Gateway
      </a>
    </div>
  </div>

  <div id="v2-toast-container" class="toast-container"></div>

  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Redirect if already authenticated as student
    document.addEventListener("DOMContentLoaded", () => {
      const existing = AuthV2.getStudent();
      if (existing) {
        window.location.href = "index.html";
      }
    });

    function quickFillStudent(id) {
      document.getElementById("studentId").value = id;
      document.getElementById("password").value = "123";
      AuthV2.showToast(`Selected demo credentials for ${id}. Click sign in!`, "info");
    }

    function showDefaultPassHint() {
      AuthV2.showToast("All demo accounts use password: 123", "info");
    }

    function handleStudentLogin(e) {
      e.preventDefault();
      const id = document.getElementById("studentId").value;
      const pass = document.getElementById("password").value;

      const res = AuthV2.loginStudent(id, pass);
      if (res.success) {
        AuthV2.showToast(`Welcome back, ${res.user.name}! Redirecting...`, "success");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 600);
      } else {
        AuthV2.showToast(res.message, "error");
      }
    }
  </script>
</body>
</html>
